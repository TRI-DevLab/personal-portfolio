<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lab Protocol Not Found | TRI-DevLab</title>
    
    <!-- Absolute link path for GitHub Pages subpath -->
    <link rel="icon" type="image/svg+xml" href="/personal-portfolio/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/personal-portfolio/css/style-main.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121316;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            background: #1b1d24;
            border: 1px solid #292d38;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #ec1839;
            margin-bottom: 10px;
            line-height: 1;
        }
        .error-card h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .error-card p {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 15px;
        }
        /* Self-contained button styles */
        .btn-return {
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 32px;
            color: #ffffff !important;
            background: #ec1839;
            border-radius: 40px;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-return:hover {
            transform: translateY(-2px);
            background: #d01330;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Protocol Node Missing</h1>
        <p>The requested route does not exist or has been relocated within the DevLab directory.</p>
        <a href="/personal-portfolio/" class="btn-return">Return to Base</a>
    </div>
</body>
</html>
