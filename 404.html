<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lab Protocol Not Found | TRI-DevLab</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/style-main.css">
    <style>
        body {
            background-color: #121316;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }
        .error-card {
            max-width: 520px;
            padding: 40px;
            border-radius: 12px;
            background: #1b1d24;
            border: 1px solid #292d38;
        }
        .error-code {
            font-size: 72px;

            color: #ec1839;
            margin-bottom: 10px;
        }
        .error-card h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        .error-card p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="error-card shadow-dark">
        <div class="error-code">404</div>
        <h1>Protocol Node Missing</h1>
        <p>The requested route does not exist or has been relocated within the DevLab directory.</p>
        <a href="/personal-portfolio/" class="btn">Return to Base</a>
    </div>

</html>
